schema_version: 1

context:
  name: opentelemetry-instrumentation-pinecone
  version: "0.62.4"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/opentelemetry_instrumentation_pinecone-${{ version }}.tar.gz
  sha256: 6e3d8f3788c35ef40ddbe085b84565ab09c9ae88058b87bccacbb9e5bb708ac7

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - hatchling
    - pip
  run:
    - python >=${{ python_min }}
    - opentelemetry-api >=1.38.0,<2.0.0
    - opentelemetry-instrumentation >=0.59b0
    - opentelemetry-semantic-conventions >=0.59b0
    - opentelemetry-semantic-conventions-ai >=0.5.2,<0.6.0
  run_constraints:
    - pinecone >=5.0.0,<6.0.0

tests:
  - requirements:
      run:
        - python ${{ python_min }}.*
        - pinecone
        - pip
    script:
      - python -c "import opentelemetry.instrumentation.pinecone"
      - pip check

about:
  summary: OpenTelemetry Pinecone instrumentation
  license: Apache-2.0
  license_file: LICENSE
  homepage: https://www.traceloop.com/openllmetry
  repository: https://github.com/traceloop/openllmetry
  documentation: https://www.traceloop.com/docs/openllmetry/introduction

extra:
  recipe-maintainers:
    - timkpaine
